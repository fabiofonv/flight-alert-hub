[project]
name = "flight-alert-hub"
version = "0.1.0"
description = "Automação e monitoramento inteligente de voos e milhas"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.48.0",
    "pydantic>=2.9.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "python-telegram-bot>=21.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "config"]